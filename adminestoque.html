<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="barra-topo">
        <div class="marca-topo">Painel do Administrador (Moises)</div>
        <button onclick="sairAdmin()" class="btn-topo" style="border-color: var(--vermelho-botao); color: var(--vermelho-botao); background: none; cursor: pointer;">Sair</button>
    </nav>

    <main class="container-carrinho" style="max-width: 800px;">
        <section class="secao-titulo" style="margin: 2rem 0 1rem 0;">
            <h1>Gerenciamento de Produtos</h1>
            <p class="subtitulo-secao">Altere os dados dos livros abaixo e clique em salvar.</p>
        </section>

        <!-- Lista organizada um acima do outro -->
        <div id="lista-admin-produtos"></div>

        <button onclick="salvarAlteracoesAdmin()" class="btn-comprar" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 1rem; cursor: pointer;">Salvar Alterações</button>
    </main>

    <script src="script.js"></script>
    <script>
        // Trava de segurança para impedir acesso se não for o Moises
        if (localStorage.getItem('adminAutenticado') !== 'true') {
            alert('Acesso restrito!');
            window.location.href = 'login.html';
        }

        function sairAdmin() {
            localStorage.removeItem('adminAutenticado');
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
