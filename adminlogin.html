<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Estoque e Preços</title>
    
    <link rel="icon" href="icone-provisorio.jpg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="barra-topo">
        <div class="marca-topo">Painel Restrito de Inventário (Moises)</div>
        <button onclick="terminarSessaoAdmin()" class="btn-topo" style="border-color: var(--vermelho-botao); color: var(--vermelho-botao); background: none; cursor: pointer;">Terminar Sessão</button>
    </nav>

    <main class="container-carrinho" style="max-width: 900px;">
        <section class="secao-titulo" style="margin: 2rem 0 1rem 0;">
            <h1>Controle de Estoque e Preços</h1>
            <p class="subtitulo-secao">Modifique diretamente os títulos, preços e exemplares disponíveis no sistema.</p>
        </section>

        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 2rem;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--verde-escuro); text-align: left; color: var(--verde-claro);">
                        <th style="padding: 10px;">Nome do Tomo</th>
                        <th style="padding: 10px;">Preço (R$)</th>
                        <th style="padding: 10px;">Estoque</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo-admin">
                    <!-- Preenchido dinamicamente pelo JavaScript -->
                </tbody>
            </table>
        </div>
        <button onclick="salvarAlteracoesEstoque()" class="btn-comprar" style="width: 100%; padding: 12px; font-size: 1rem;">Guardar Alterações do Acervo</button>
    </main>

    <footer class="rodape-principal" style="margin-top: 5rem;">
        <div class="rodape-direitos">
            <p>&copy; 2026 Arkham. Gestão Interna de Obras.</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Trava de segurança: Se o utilizador logado não for o Moises administrador, expulsa para o login
        if (localStorage.getItem('dewey_admin_autenticado') !== 'true') {
            alert('Acesso restrito! Por favor, entre com as credenciais de administrador.');
            window.location.href = 'login.html';
        }

        function terminarSessaoAdmin() {
            localStorage.removeItem('dewey_admin_autenticado');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
