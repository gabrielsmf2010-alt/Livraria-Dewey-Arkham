<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Livro | Dewey Arkham</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="barra-topo">
        <a href="index.html" class="btn-topo">← Voltar à Loja</a>
        <a href="carrinho.html" class="btn-topo">Carrinho <span class="contador-carrinho">0</span></a>
    </nav>

    <main class="container-detalhes" id="detalhes-livro" style="max-width: 900px; margin: 40px auto; padding: 20px;">
        <!-- Preenchido via JS -->
    </main>

    <script src="script.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const livroId = parseInt(params.get('id'));
        const livros = obterLivros();
        const livro = livros.find(l => l.id === livroId);

        const container = document.getElementById('detalhes-livro');
        if (livro) {
            container.innerHTML = `
                <div style="display: flex; gap: 30px; flex-wrap: wrap; background: var(--fundo-cartao); padding: 30px; border-radius: 8px; border: 1px solid rgba(124,58,237,0.3);">
                    <img src="${livro.capa}" alt="${livro.titulo}" style="max-width: 300px; border-radius: 6px;">
                    <div style="flex: 1;">
                        <h1 style="color: var(--verde-claro); font-family: 'Cinzel', serif;">${livro.titulo}</h1>
                        <p style="color: var(--texto-secundario); font-style: italic;">Autor: ${livro.autor}</p>
                        <p style="margin: 20px 0;">${livro.desc}</p>
                        <h2 style="color: var(--verde-claro);">R$ ${livro.preco.toFixed(2)}</h2>
                        <p>Disponíveis no acervo: <strong>${livro.estoque} unidades</strong></p>
                        <button class="btn-comprar" style="margin-top: 20px; padding: 15px;" onclick="adicionarAoCarrinho(${livro.id})">Adicionar ao Carrinho</button>
                    </div>
                </div>
            `;
        } else {
            container.innerHTML = `<h2>Livro não encontrado no acervo.</h2>`;
        }
    </script>
</body>
</html>
